services:
  questionnaire-backup:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8787"
      STORAGE_DIR: /data/submissions
      BACKUP_TOKEN: ${BACKUP_TOKEN:?BACKUP_TOKEN is required}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/data/submissions
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
